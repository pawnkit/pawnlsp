name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        name: Check formatting and module files
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=1 go test -race -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawnlsp
        uses: actions/checkout@v7
        with:
          path: pawnlsp
      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: 43cee425a3a528d1b71d4e2a24eb250b7df62d59
          path: pawn-corpus
      - uses: actions/setup-go@v6
        with:
          go-version-file: pawnlsp/go.mod
      - name: Run corpus-backed tests
        working-directory: pawnlsp
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: go test -count=1 ./...

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check incremental latency and memory budgets
        env:
          PAWNKIT_PERFORMANCE_BUDGET: "1"
        run: go test -count=1 -run '^TestIncremental(PerformanceBudget|AnalysisBudget100K)$' ./lsp

  benchmarks:
    name: benchmark history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Benchmark head
        run: |
          go test -run '^$' -bench '^Benchmark(IncrementalDidChangeToAnalysis50K|IncrementalDidChangeToDiagnostics50K|IncrementalDidChangeToAnalysis100K)$' \
            -benchmem -benchtime=1x -count=6 ./lsp | tee benchmark-head.txt
      - name: Benchmark pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/pawnlsp-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/pawnlsp-base"
          go test -run '^$' -bench '^Benchmark(IncrementalDidChangeToAnalysis50K|IncrementalDidChangeToDiagnostics50K|IncrementalDidChangeToAnalysis100K)$' \
            -benchmem -benchtime=1x -count=6 ./lsp | tee benchmark-base.txt
      - name: Compare pull request benchmark
        if: github.event_name == 'pull_request'
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d \
            "$RUNNER_TEMP/pawnlsp-base/benchmark-base.txt" benchmark-head.txt | tee benchmark-comparison.txt
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pawnlsp-benchmarks
          path: benchmark-*.txt
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.73
        with:
          repository: pawnkit/pawnlsp
          targets: linux-amd64,windows-amd64,darwin-arm64
